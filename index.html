<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6f6">
  <meta name="description" content="Explore housing possibilities on church-owned vacant land with Steadmorrow.">
  <title>Steadmorrow — A closer look at the land</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/steadmorrow-icon.svg">
  <link rel="preload" href="assets/fonts/Outfit-variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#experience">Skip to the experience</a>
  <main>
    <section class="hero-story" aria-labelledby="hero-title" id="top">
      <div class="hero-stage">
        <div class="city-scene" aria-hidden="true">
          <img class="city-poster" src="assets/media/city-opening.webp" width="1600" height="1000" alt="" fetchpriority="high">
          <video class="city-video" id="city-video" autoplay loop muted playsinline preload="auto" tabindex="-1" poster="assets/media/city-opening.webp" disablepictureinpicture>
            <source src="assets/media/steadmorrow-city.mp4" type="video/mp4">
          </video>
        </div>
        <header class="site-header">
          <div class="brand-lockup">
          <a class="brand" href="#top" aria-label="Steadmorrow home">
            <svg class="brand-icon" viewBox="0 0 56 56" aria-hidden="true"><rect x="2" y="2" width="52" height="52" rx="8" fill="currentColor"/>
  <path d="M17 20 35 15 40 35 21 41Z" fill="none" stroke="white" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="m22 25 9-2 2 8-9 3Z" fill="white"/>
  <g fill="white"><circle cx="17" cy="20" r="3.2"/><circle cx="35" cy="15" r="3.2"/><circle cx="40" cy="35" r="3.2"/><circle cx="21" cy="41" r="3.2"/></g></svg>
            <span class="brand-wordmark" aria-hidden="true">steadmorrow</span>
          </a>
          <p class="brand-audience">For Churches</p>
          </div>
        </header>
        <div class="hero-copy">
          <h1 id="hero-title"><span>Could this <span class="headline-subject">church land</span></span><span>become housing?</span></h1>
          <a class="start-button" href="#experience">Get started</a>
        </div>
        <div class="hero-bottom">
          <div class="motion-controls">
            <button class="motion-button" type="button" aria-label="Play city animation" aria-controls="city-video" hidden>
              <svg class="play-symbol" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 9 6-9 6Z"/></svg>
              <svg class="pause-symbol" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4h3v12H6zM12 4h3v12h-3z"/></svg>
              <svg class="replay-symbol" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5a7 7 0 1 1-1.6 8M5 1v5H1"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- The next experience will be implemented here in a later iteration. -->
    <section class="experience" id="experience" aria-labelledby="experience-title">
      <div class="experience-intro">
        <span class="section-number" aria-hidden="true">01</span>
        <h2 id="experience-title" tabindex="-1">Start with the land.</h2>
      </div>
    </section>
  </main>
</body>
</html>
